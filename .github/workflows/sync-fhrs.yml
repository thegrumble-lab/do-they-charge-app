name: FHRS weekly sync

# Runs automatically every Monday at 04:00 UTC (see the schedule trigger
# below), and can also be triggered manually any time from the Actions
# tab. Verified end-to-end with a dry run and a real run first — see
# HANDOFF.md ("Automated weekly sync") for the numbers from that first
# real run.
#
# Runs on GitHub's infrastructure deliberately, not from the app or from
# a Claude session — both of those sit behind an egress allowlist that
# blocks the FHRS download domain outright. GitHub Actions runners have
# normal internet access.
on:
  schedule:
    # Minute/hour in UTC. The FHRS feed updates daily, so a weekly sync
    # is a deliberate cadence choice, not a limitation of the source data.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the diff and log it, but write nothing"
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # The national CSV is large; downloading + streaming-parsing +
    # batch-upserting comfortably fits in this window with room to spare,
    # but a Vercel serverless function's much shorter timeout would not
    # have — that's the main reason this lives in GitHub Actions.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js's realtime client requires native
          # WebSocket support, which needs Node 22+ (it throws at client
          # construction even though this script never uses realtime).
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run FHRS sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # On a scheduled run there's no workflow_dispatch input, so
          # inputs.dry_run resolves to empty/null — which correctly means
          # "not dry run" (a real, non-dry, live sync), matching the
          # default we verified before turning the schedule on.
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run sync:fhrs
