name: Ship preview

# Puts everything on the preview branch live: brings any main-only commits into
# preview, then moves main to preview, which triggers one production deploy on
# Netlify. Started automatically once a day at 17:00 by the job scheduler on
# Carer Tickets' Netlify site (no approval needed), and can also be run by hand.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ship-preview
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ship preview to main
        run: |
          git fetch -q origin main preview
          if [ "$(git rev-list --count origin/main..origin/preview)" = "0" ]; then echo "Nothing to ship"; exit 0; fi
          git config user.name "thegrumble-lab"
          git config user.email "323149094+thegrumble-lab@users.noreply.github.com"
          git checkout -q -B preview origin/preview
          if ! git merge-base --is-ancestor origin/main preview; then
            echo "main has commits that preview doesn't: merging them into preview first"
            git merge --no-edit origin/main -m "Merge main into preview before shipping"
            git push origin preview
          fi
          git push origin preview:refs/heads/main
