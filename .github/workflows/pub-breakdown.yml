name: Pub breakdown (one-off, read-only)

# Splits the press figures into pubs vs restaurants/cafes by looking each
# listing's FSA business type up by FHRSID. Read-only on Supabase. Runs when
# the run/pub-breakdown branch is pushed (or manually); results go to the
# pub-breakdown-results branch, which Vercel never deploys.
on:
  push:
    branches: [run/pub-breakdown]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  breakdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compute breakdown
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/pub-breakdown.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save results to the pub-breakdown-results branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b pub-breakdown-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Pub breakdown $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pub-breakdown-results
